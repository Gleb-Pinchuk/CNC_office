events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    client_max_body_size 100M;

    upstream django {
        server web:8000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # ✅ Отключаем информацию о версии nginx
        server_tokens off;

        # ✅ СТАТИКА — отдаём напрямую из volume
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            try_files $uri $uri/ =404;
            autoindex off;
        }

        # ✅ МЕДИА — отдаём напрямую из volume
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff;
            try_files $uri $uri/ =404;
            autoindex off;
        }

        # ✅ Favicon — кэшируем надолго
        location = /favicon.ico {
            alias /app/staticfiles/favicon.ico;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ✅ ВСЁ ОСТАЛЬНОЕ — проксируем на Django
        location / {
            proxy_pass http://django;

            # ✅ Заголовки для Django
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ✅ Для keepalive с upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # ✅ Таймауты
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;

            # ✅ Буферы для больших ответов
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ✅ Страницы ошибок
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
