events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ✅ Сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # ✅ Статика
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
        }

        # ✅ Медиа
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Access-Control-Allow-Origin *;
        }

        # ✅ Основное приложение
        location / {
            proxy_pass http://django;

            # Заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;

            # ✅ CORS
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

            # ✅ CSP для FortuneSheet (разрешаем eval)
            add_header Content-Security-Policy "default-src 'self' https: http: 'unsafe-inline' 'unsafe-eval'; script-src 'self' https: http: 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net; style-src 'self' https: http: 'unsafe-inline' cdn.jsdelivr.net; connect-src 'self' https: http:; img-src 'self' https: http: data: blob:; font-src 'self' https: http: data:; frame-src 'self' https: http:; worker-src 'self' blob:; child-src 'self' blob:;" always;

            # ✅ Другие заголовки безопасности
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;

            # ✅ Preflight для CORS
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
    }
}
