<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Office — Облачное хранилище</title>

    <!-- ✅ Luckysheet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet/dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet/dist/plugins/plugins.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet/dist/css/luckysheet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet/dist/assets/iconfont/iconfont.css" />

    <!-- ✅ Luckysheet JS -->
    <script src="https://cdn.jsdelivr.net/npm/luckysheet/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet/dist/luckysheet.umd.js"></script>

    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #2a2a4a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ✅ Luckysheet контейнер */
        #luckysheet-container {
            width: 100%;
            height: calc(100vh - 120px);
            margin: 0;
            padding: 0;
            display: none; /* Скрыт по умолчанию, показывается при открытии таблицы */
        }

        /* ✅ Стили интерфейса */
        .app { display: flex; min-height: 100vh; }
        .sidebar {
            width: 220px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }
        .main {
            flex: 1;
            margin-left: 220px;
            padding: 1.5rem;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            padding: 0.5rem 0 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 0.25rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-item:hover, .nav-item.active {
            background: var(--accent);
            color: white;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .header-actions { display: flex; gap: 0.5rem; align-items: center; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        .btn-outline:hover { background: var(--bg-card); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }
        .user-info { display: flex; align-items: center; gap: 0.5rem; }

        /* ✅ Сетка файлов */
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .file-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .file-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .file-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .file-name {
            font-weight: 500;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }
        .file-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .file-card:hover .file-actions { opacity: 1; }
        .file-action-btn {
            background: var(--bg-secondary);
            border: none;
            border-radius: 4px;
            padding: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .file-action-btn:hover { background: var(--accent); }

        /* ✅ Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 1.5rem;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* ✅ Состояния */
        .loading, .empty {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        .loading.show, .empty.show { display: block; }
        .hidden { display: none !important; }

        /* ✅ Уведомления */
        .toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- ✅ Основной контейнер приложения -->
    <div class="app">
        <!-- ✅ Боковая панель -->
        <aside class="sidebar">
            <div class="logo">🔧 CNC Office</div>
            <nav>
                <a class="nav-item active" data-view="files">📁 Мои файлы</a>
                <a class="nav-item" data-view="folders">📂 Папки</a>
                <a class="nav-item" data-view="documents">📄 Документы</a>
                <a class="nav-item" data-view="section-attendance">📊 Посещаемость</a>
                <a class="nav-item" data-view="section-rangers">🤖 Рейнджеры</a>
                <a class="nav-item" data-view="section-statements">📋 Ведомости</a>
                <a class="nav-item" data-view="shared">🔗 Общий доступ</a>
                <a class="nav-item" data-view="logs">📋 Журнал</a>
            </nav>
            <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border);">
                <div class="user-info">
                    <span>👤 <span id="username">Гость</span></span>
                    <button class="btn btn-outline" id="logoutBtn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Выйти</button>
                </div>
            </div>
        </aside>

        <!-- ✅ Основной контент -->
        <main class="main">
            <div class="header">
                <h1 id="pageTitle">Мои файлы</h1>
                <div class="header-actions">
                    <button class="btn" id="uploadBtn">📤 Загрузить файл</button>
                </div>
            </div>

            <!-- ✅ Состояния -->
            <div class="loading" id="loadingState">
                <div style="font-size: 2rem;">⏳</div>
                <p>Загрузка...</p>
            </div>
            <div class="empty" id="emptyState" style="display: none;">
                <div style="font-size: 3rem;">📭</div>
                <p>Нет данных</p>
            </div>

            <!-- ✅ Сетка файлов/папок -->
            <div class="files-grid" id="filesGrid"></div>
        </main>
    </div>

    <!-- ✅ Luckysheet контейнер (для редактора таблиц) -->
    <div id="luckysheet-container"></div>

    <!-- ✅ Модальные окна -->

    <!-- Загрузка файла -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📤 Загрузить файл</h3>
                <button class="modal-close" onclick="hideModal('uploadModal')">&times;</button>
            </div>
            <form id="uploadForm">
                <div class="form-group">
                    <label>Файл</label>
                    <input type="file" id="fileInput" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Папка (необязательно)</label>
                    <select id="folderSelect" class="form-control">
                        <option value="">Корневая папка</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Загрузить</button>
            </form>
        </div>
    </div>

    <!-- Логин / Регистрация -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔐 Вход</h3>
                <button class="modal-close" onclick="hideModal('loginModal')">&times;</button>
            </div>

            <!-- Форма входа -->
            <form id="loginForm">
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="loginUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Войти</button>
                <p style="text-align: center; margin-top: 1rem; color: var(--text-secondary);">
                    Нет аккаунта? <a href="#" id="toggleToRegister" style="color: var(--accent);">Зарегистрироваться</a>
                </p>
            </form>

            <!-- Форма регистрации (скрыта) -->
            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="registerUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="registerPassword" class="form-control" required minlength="8">
                </div>
                <div class="form-group">
                    <label>Повторите пароль</label>
                    <input type="password" id="registerPassword2" class="form-control" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Зарегистрироваться</button>
                <p style="text-align: center; margin-top: 1rem; color: var(--text-secondary);">
                    Уже есть аккаунт? <a href="#" id="toggleToLogin" style="color: var(--accent);">Войти</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Предпросмотр файла -->
    <div class="modal" id="previewModal">
        <div class="modal-content" style="max-width: 800px; width: 95%;">
            <div class="modal-header">
                <h3 id="previewTitle">Предпросмотр</h3>
                <button class="modal-close" onclick="hideModal('previewModal')">&times;</button>
            </div>
            <div id="previewContent" style="min-height: 200px;"></div>
        </div>
    </div>

    <!-- Редактор документа/таблицы -->
    <div class="modal" id="documentModal" style="width: 100%; height: 100%; max-width: none; max-height: none; padding: 0;">
        <div class="modal-content" style="width: 100%; height: 100%; max-width: none; max-height: none; border-radius: 0; padding: 0; display: flex; flex-direction: column;">
            <div class="modal-header" style="margin: 0; padding: 0.75rem 1rem; border-radius: 0;">
                <h3 id="documentTitle" style="margin: 0;">Таблица</h3>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-outline" onclick="exportToExcel()">📤 Excel</button>
                    <button class="btn" onclick="saveDocument()">💾 Сохранить</button>
                    <button class="modal-close" onclick="hideModal('documentModal')">&times;</button>
                </div>
            </div>
            <!-- Контейнер для Luckysheet или текстового редактора -->
            <div id="handsontable-container" style="flex: 1; min-height: 0;"></div>
        </div>
    </div>

    <!-- Создание документа -->
    <div class="modal" id="createDocumentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📄 Создать таблицу</h3>
                <button class="modal-close" onclick="hideModal('createDocumentModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="newDocTitle" class="form-control" placeholder="Моя таблица">
            </div>
            <button class="btn" onclick="createDocument()" style="width: 100%;">Создать</button>
        </div>
    </div>

    <!-- ✅ Подключаем app.js через /static/ -->
    <script src="/static/app.js?v=19.5"></script>
</body>
</html>
