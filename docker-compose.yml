---
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cnc_office_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cnc_office}
      POSTGRES_USER: ${POSTGRES_USER:-cnc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnc_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnc_office_web
    restart: unless-stopped
    command: /start
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - '8000'
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', 'manage.py', 'check', '--deploy']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cnc_office_nginx
    restart: unless-stopped
    ports:
      - '8002:80'
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  app-network:
    driver: bridge
    name: cnc_office_network
