# docker-compose.yml
version: '3.8'

services:
  # ✅ PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: cnc_office_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cnc_office}
      POSTGRES_USER: ${POSTGRES_USER:-cnc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnc_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cnc_user} -d ${POSTGRES_DB:-cnc_office}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ✅ Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnc_office_web
    restart: unless-stopped
    command: /start
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--deploy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ✅ Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cnc_office_nginx
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ✅ Volumes
volumes:
  postgres_
  static_volume:
  media_volume:
  logs_volume:

# ✅ Networks
networks:
  app-network:
    driver: bridge
    name: cnc_office_network
