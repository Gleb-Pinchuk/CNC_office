---
services:
  db:
    image: postgres:15-alpine
    container_name: cnc_office_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cnc_office}
      POSTGRES_USER: ${POSTGRES_USER:-cnc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnc_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnc_office_web
    restart: unless-stopped
    command: /start
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - '8000'
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    depends_on:
      - db  # ✅ Просто ждём запуска (без healthcheck)
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cnc_office_nginx
    restart: unless-stopped
    ports:
      - '8002:80'
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web  # ✅ Просто ждём запуска (без healthcheck)
    networks:
      - app-network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  app-network:
    driver: bridge
    name: cnc_office_network