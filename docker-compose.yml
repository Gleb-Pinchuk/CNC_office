services:
  db:
    image: postgres:15-alpine
    container_name: cnc_office_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cnc_office}
      POSTGRES_USER: ${POSTGRES_USER:-cnc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnc_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cnc_user}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - db-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: cnc_redis
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnc_office_web
    restart: unless-stopped
    command: /start
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - '8000'
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ > /dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - app-network
      - db-network
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  caddy:
    image: caddy:2.9-alpine
    container_name: cnc_office_caddy
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_volume:/srv/static:ro
      - media_volume:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnc_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A config worker -l info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
    volumes:
      - .:/app
    networks:
      - app-network
      - db-network
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnc_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A config beat -l info
    depends_on:
      redis:
        condition: service_started
      web:
        condition: service_started
    volumes:
      - .:/app
    networks:
      - app-network
      - db-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

  vk_bot:
    build:
      context: ./vk_student_bot
      dockerfile: Dockerfile
    container_name: cnc_vk_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CNC_API_BASE: http://web:8000/api
    depends_on:
      web:
        condition: service_started
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
    name: cnc_office_app
  db-network:
    driver: bridge
    internal: true
    name: cnc_office_db_internal
