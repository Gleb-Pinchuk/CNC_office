name: Deploy to Alpine Production

on:
  push:
    branches:
      - develop
      - fix/bot-and-table-editor
      - feature/student-monitoring-vk-celery
      - "codex-*"
      - "codex/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          set -euo pipefail
          RELEASE="$RUNNER_TEMP/cnc_office_release.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.coverage' \
            --exclude='media' \
            --exclude='logs' \
            --exclude='staticfiles' \
            -czf "$RELEASE" .
          cp "$RELEASE" ./cnc_office_release.tar.gz

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 2222
          source: cnc_office_release.tar.gz
          target: /tmp

      - name: Deploy on Alpine/OpenRC server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 2222
          script: |
            set -eu

            PROJECT_DIR="${DEPLOY_PROJECT_DIR:-/opt/cnc_office}"
            RELEASE="/tmp/cnc_office_release.tar.gz"

            echo "Deploy start: $(date)"
            test -f "$RELEASE"
            test -f /etc/cnc-office/app.env

            rc-service cnc-vk-bot stop || true
            rc-service cnc-office-celery-beat stop || true
            rc-service cnc-office-celery-worker stop || true
            rc-service cnc-office-web stop || true
            pkill -f '[g]unicorn config.wsgi:application' || true

            mkdir -p "$PROJECT_DIR"
            for item in "$PROJECT_DIR"/* "$PROJECT_DIR"/.[!.]* "$PROJECT_DIR"/..?*; do
              [ -e "$item" ] || continue
              case "$(basename "$item")" in
                .venv|media|logs|staticfiles) continue ;;
              esac
              rm -rf "$item"
            done

            tar -xzf "$RELEASE" -C "$PROJECT_DIR"
            rm -f "$RELEASE"

            chown -R cnc:cnc "$PROJECT_DIR"
            find "$PROJECT_DIR" -path "$PROJECT_DIR/.venv" -prune -o -type d -exec chmod 755 {} +
            find "$PROJECT_DIR" -path "$PROJECT_DIR/.venv" -prune -o -type f -exec chmod 644 {} +
            [ ! -d "$PROJECT_DIR/.venv/bin" ] || chmod 755 "$PROJECT_DIR"/.venv/bin/*
            chmod +x "$PROJECT_DIR"/ops/start_gunicorn_systemd.sh
            chmod +x "$PROJECT_DIR"/ops/start_web_openrc.sh
            chmod +x "$PROJECT_DIR"/ops/openrc/*

            sed -i 's/\r$//' "$PROJECT_DIR"/ops/start_gunicorn_systemd.sh
            sed -i 's/\r$//' "$PROJECT_DIR"/ops/start_web_openrc.sh
            sed -i 's/\r$//' "$PROJECT_DIR"/ops/openrc/*

            cp "$PROJECT_DIR"/ops/openrc/* /etc/init.d/
            chmod +x /etc/init.d/cnc-*
            sed -i 's/\r$//' /etc/init.d/cnc-*

            chown root:cnc /etc/cnc-office/app.env
            chmod 640 /etc/cnc-office/app.env

            if [ ! -x "$PROJECT_DIR/.venv/bin/python" ]; then
              su cnc -c "cd '$PROJECT_DIR' && python3 -m venv .venv"
            fi
            su cnc -c "cd '$PROJECT_DIR' && .venv/bin/pip install --upgrade pip"
            su cnc -c "cd '$PROJECT_DIR' && .venv/bin/pip install -r requirements.txt"
            su cnc -c "cd '$PROJECT_DIR' && .venv/bin/pip install -r vk_student_bot/requirements.txt"

            rc-update add cnc-db-tunnel default || true
            rc-update add cnc-office-web default || true
            rc-update add cnc-office-celery-worker default || true
            rc-update add cnc-office-celery-beat default || true
            rc-update add cnc-vk-bot default || true

            rc-service cnc-db-tunnel restart || rc-service cnc-db-tunnel start
            sleep 2
            pg_isready -h 127.0.0.1 -p 15432 -U cnc_user -d cnc_office

            : > /var/log/cnc-office/cnc-office-web.log || true
            rc-service cnc-office-web start
            sleep 8
            rc-service cnc-office-web status

            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/ || echo 000)"
            if [ "$CODE" != "200" ] && [ "$CODE" != "401" ] && [ "$CODE" != "403" ]; then
              echo "Unexpected Django HTTP code: $CODE"
              tail -n 120 /var/log/cnc-office/cnc-office-web.log || true
              exit 1
            fi

            rc-service cnc-office-celery-worker start
            rc-service cnc-office-celery-beat start
            rc-service cnc-vk-bot start
            sleep 5

            rc-service cnc-office-celery-worker status
            rc-service cnc-office-celery-beat status
            rc-service cnc-vk-bot status

            echo "Deploy finished: $(date)"
