name: Deploy to Production

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            
            echo "🚀 Начало деплоя: $(date)"
            cd ~/cnc_office_v2
            
            # 1. Pull свежих изменений
            echo "🔄 Pull свежих изменений..."
            git fetch origin develop
            git reset --hard origin/develop
            
            # 2. Остановка и очистка
            echo "🛑 Остановка контейнеров..."
            docker compose down --remove-orphans || true
            
            echo "🧹 Очистка кэша Docker..."
            docker image prune -f
            docker builder prune -f
            
            # 3. 🔨 ПЕРЕСБОРКА ОБРАЗОВ (с --no-cache)
            echo "🔨 Пересборка образов (без кэша)..."
            docker compose build --no-cache --force-rm
            
            # 4. ▶️ Запуск контейнеров
            echo "▶️ Запуск проекта..."
            docker compose up -d --force-recreate
            
            # 5. ⏳ Ожидание запуска (важно для БД!)
            echo "⏳ Ожидание запуска сервисов (45 сек)..."
            sleep 45
            
            # 6. 🏥 Проверка здоровья контейнеров
            echo "🏥 Проверка статуса контейнеров..."
            docker compose ps
            
            # 7. 🗄 АВТОМАТИЧЕСКИЕ МИГРАЦИИ
            echo "🗄 Применение миграций..."
            docker compose exec -T web python manage.py migrate --noinput || echo "⚠️ Миграции: предупреждение"
            
            # 8. 📁 Сборка статики
            echo "📁 Сборка статики..."
            docker compose exec -T web python manage.py collectstatic --noinput --clear || echo "⚠️ Статика: предупреждение"
            
            # 9. 🔍 Проверка ответа приложения
            echo "🔍 Проверка доступности API..."
            HTTP_CODE=$(docker compose exec -T web curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/ || echo "000")
            echo "📊 HTTP код от Django: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "✅ Backend отвечает корректно!"
            elif [ "$HTTP_CODE" = "500" ]; then
              echo "❌ ОШИБКА 500! Смотрим логи Django..."
              docker compose logs web --tail=100
              exit 1
            else
              echo "⚠️ Неожиданный код: $HTTP_CODE"
              docker compose logs web --tail=50
            fi
            
            # 10. 🌐 Проверка через Nginx
            echo "🌐 Проверка через Nginx..."
            sleep 5
            EXTERNAL_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/api/ || echo "000")
            echo "📊 HTTP код от Nginx: $EXTERNAL_CODE"
            
            # 11. 🧹 Финальная очистка
            echo "🧹 Очистка старых образов..."
            docker image prune -f --filter="until=24h"
            
            echo "✅ Деплой завершён: $(date)"
            echo "🔗 Приложение доступно: http://${{ secrets.DEPLOY_HOST }}:8002/"
